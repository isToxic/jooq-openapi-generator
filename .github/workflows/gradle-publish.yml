name: Publish to GitHub Packages

on:
  release:
    types: [created]
  push:
    tags:
      - '*.*.*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для публикации (например, 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        GH_USERNAME: ${{ github.repository_owner }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION_TO_PUBLISH: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
