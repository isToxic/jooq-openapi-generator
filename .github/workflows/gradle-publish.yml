name: Publish to GitHub Packages

on:
  release:
    types: [created]

  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для публикации (например, 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        GH_USERNAME: \${{ github.actor }}
        GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
